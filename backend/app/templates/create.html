{% extends "base.html" %}
{% block title %}membase — Remember{% endblock %}
{% block content %}
<section class="panel">
  <h1>Write what you want to remember</h1>
  <form id="create-form">
    <textarea id="text" name="text" rows="4"
      placeholder="e.g. I met Anna at ETH yesterday. She studies robotics and recommended a paper about tactile sensing."
      required></textarea>

    <label for="files">Attachments (optional)</label>
    <input id="files" name="files" type="file" multiple />

    <button type="submit">Save</button>
  </form>

  <!-- Each submission gets its own card below, independent of any other
       in-flight capture -- submitting a second memory never waits on the
       first one's clarification or background processing. -->
  <div id="captures"></div>
</section>

<script src="/static/app.js"></script>
<script>membase.initCreatePage();</script>
{% endblock %}
