<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}membase{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <div class="brand">membase</div>
    <nav>
      <a href="/">Store</a>
      <a href="/recall">Remember</a>
      <a href="/captures">Browse</a>
      <a href="/docs">Docs</a>
    </nav>
    <div class="settings">
      <button id="settings-toggle" class="settings-toggle" type="button" aria-haspopup="true" aria-expanded="false" title="Settings">&#9881;</button>
      <div id="settings-menu" class="settings-menu hidden">
        <button id="logout-button" class="settings-logout" type="button">Forget backend credentials</button>
      </div>
    </div>
  </header>
  <div id="login-overlay" class="login-overlay hidden">
    <form id="login-form" class="login-form">
      <h1>membase</h1>
      <p class="muted">Sign in.</p>
      <label>
        Username
        <input type="text" id="login-username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit">Connect</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
