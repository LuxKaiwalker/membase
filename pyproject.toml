[project]
name = "membase"
version = "0.1.0"
description = "Self-hosted augmented personal memory MVP"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live local LLM (Ollama); slower, real-model behavior",
]

[tool.setuptools]
# No wheel is built; dependencies are provided by flake.nix (nixpkgs
# python313Packages), not PyPI. This file exists for tool config only.
py-modules = []
