# nginx server block for membase -- see docs/DEPLOYMENT.md "nginx + Cloudflare
# Tunnel" for the full setup (htpasswd generation, cloudflared ingress config,
# how this fits into a NixOS services.nginx.virtualHosts block).
#
# Sits between Cloudflare Tunnel (cloudflared, which terminates the public
# TLS connection at Cloudflare's edge and forwards here over a plain local
# HTTP connection -- no public-facing socket on this machine at all, see
# docs/DECISIONS.md "Cloudflare Tunnel for CGNAT-safe public reachability")
# and the membase FastAPI backend on 127.0.0.1:8000. Owns every cross-cutting
# concern that used to live in the app itself before auth was retired from
# it -- see docs/DECISIONS.md "Retire app-level auth for nginx Basic Auth".
#
# CORS is handled entirely here, not in the FastAPI app -- moved after a
# live bug: nginx can reject a request itself (auth_basic's 401, the rate
# limiter's 429) before it ever reaches the app, and a response nginx
# generates on its own never carries whatever CORS headers the app's
# middleware would have added. A cross-origin 401 with no CORS header is
# invisible to the browser's JS (blocked as a CORS failure, not readable
# as a 401), which silently broke the frontend's "401 -> clear stored
# credentials -> show the login prompt again" retry flow. nginx is the
# only layer that sees every response, so it's the only layer that can
# make this true unconditionally. See docs/DECISIONS.md "Move CORS to
# nginx: an app-level CORSMiddleware can't cover a proxy-level rejection".

limit_req_zone $binary_remote_addr zone=membase_general:10m rate=10r/s;

server {
    # Plain HTTP on loopback only -- TLS is already terminated by Cloudflare's
    # edge before cloudflared ever forwards the request here. Never expose
    # this listener on a non-loopback interface.
    listen 127.0.0.1:8080;
    # A sibling, single-level subdomain of the frontend's -- not
    # api.membase.vxliu.com (two levels deep), which Cloudflare's free
    # Universal SSL cert (covers only the zone apex + one wildcard
    # level, *.vxliu.com) doesn't reach; confirmed by inspecting the
    # actual served cert's SAN list when that hostname's TLS handshake
    # failed. See docs/DECISIONS.md "Cloudflare Tunnel for CGNAT-safe
    # public reachability". membase.vxliu.com itself is GitHub Pages'
    # custom domain for the frontend and can't also point at this tunnel.
    server_name membase-api.vxliu.com;

    # cloudflared sets CF-Connecting-IP to the real client IP on every
    # request it forwards. Trusted here because this connection is always
    # local (cloudflared -> nginx over loopback) -- never a direct
    # internet-facing socket an attacker could spoof the header on by
    # connecting straight to this server. Used below for rate limiting and
    # passed through as X-Real-IP so the app's own logs see the real client.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Matches app/config.py's membase_max_upload_mb default -- rejects an
    # oversized body here, before it costs the Python process anything.
    client_max_body_size 50m;

    # Security headers the app itself never set (see docs/DEPLOYMENT.md
    # "Known non-blocking gaps" -- this closes that gap at the edge instead
    # of in application code). `always` is required for these to also be
    # sent on error responses (e.g. the 401 auth_basic itself returns),
    # not just 2xx -- nginx's add_header otherwise only applies to success
    # responses.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # General edge rate limit across every route -- replaces the app's
        # own /login-specific rate limiting, which was retired along with
        # the rest of its auth system. This is coarser (every route, not
        # brute-force-aware) but covers every endpoint instead of just one.
        limit_req zone=membase_general burst=20 nodelay;

        # CORS, unconditionally -- on every response this location can
        # produce, including auth_basic's own 401 below and the rate
        # limiter's 429 above, not just successful proxied ones. `always`
        # is required for the same reason as the security headers above:
        # add_header only applies to 2xx/3xx by default otherwise. No
        # Access-Control-Allow-Credentials -- the frontend attaches Basic
        # Auth as an explicit header via its own JS, not as a browser-
        # managed cookie, so credentialed CORS mode is correctly unused.
        add_header Access-Control-Allow-Origin "https://membase.vxliu.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 600 always;

        # A CORS preflight (OPTIONS) request carries no credentials by
        # design -- the browser never attaches Authorization to it, and
        # it doesn't need to reach the app at all; nginx answers it
        # directly, with the CORS headers above already attached.
        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_basic "membase";
        auth_basic_user_file /etc/nginx/membase.htpasswd;

        # The app no longer sets its own CORS headers (see
        # docs/DECISIONS.md) -- nothing to hide here. If that ever
        # changes, this location would need proxy_hide_header on each
        # Access-Control-* header to avoid sending duplicate values,
        # which browsers reject.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
